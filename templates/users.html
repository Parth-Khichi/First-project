<!DOCTYPE html>
<html>
<head>
    <title>Users</title>
</head>
<body>

    <h1>Users List</h1>

    <table border="1">
        <tr>
            <th>Name</th>
            <th>Email</th>
        </tr>

        {% for user in users %}
        <tr>
            <td>{{ user.name }}</td>
            <td>{{ user.email }}</td>
        </tr>
        {% endfor %}
    </table>

</body>
</html>
